<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17202a;background:#fff}
  header{background:#17202a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
  header img{width:24px;height:24px}
  header b{font-size:15px}
  header span{margin-left:auto;font-size:11px;color:#9aa4ae}
  main{padding:12px 16px 14px}
  .site{font-size:12px;color:#5b6670;margin-bottom:10px}
  .site b{color:#17202a}
  button{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:10px 12px;margin:0 0 8px;color:#fff;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
  button small{display:block;font-weight:400;font-size:12px;opacity:.85}
  button:disabled{background:#e9ecef !important;color:#9aa4ae;cursor:default}
  #agenda{background:#c8501e} #kopieer{background:#6f42c1} #plak{background:#1f6feb}
  #melding{font-size:12px;color:#b42318;min-height:0;margin-top:2px}
  footer{border-top:1px solid #e3e6ea;padding:8px 16px;font-size:12px}
  footer a{color:#5b6670}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>BBM Tools</b><span id="versie"></span></header>
<main>
  <div class="site" id="site">Bezig…</div>
  <button id="agenda" disabled>→ Agenda<small>Project naar Outlook-afspraak</small></button>
  <button id="kopieer" disabled>2Jours → Kopieer<small>Calculatie naar het klembord</small></button>
  <button id="plak" disabled>Bouw7 ← Plak<small>Regels in deze offerte zetten</small></button>
  <div id="melding"></div>
</main>
<footer><a href="https://bbm.joostmaes.nl/" target="_blank">Uitleg en hulp</a></footer>
<script src="popup.js"></script>
</body>
</html>
