<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1b;background:#fff}
  header{background:#fff;color:#1d1d1b;border-bottom:3px solid #e30613;padding:10px 16px;display:flex;align-items:center;gap:10px}
  header img{width:28px;height:28px}
  header b{font-size:15px}
  header span{margin-left:auto;font-size:11px;color:#80807c}
  main{padding:12px 16px 14px}
  .site{font-size:12px;color:#5f5f5c;margin-bottom:10px}
  .site b{color:#1d1d1b}
  button{display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:10px 12px;margin:0 0 8px;color:#fff;font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;cursor:pointer}
  button small{display:block;font-weight:400;font-size:12px;opacity:.85}
  button:disabled{background:#f0f0ef !important;color:#9a9a96;cursor:default}
  #agenda{background:#e30613} #kopieer,#plak{background:#1d1d1b}
  #melding{font-size:12px;color:#a3000b;min-height:0;margin-top:2px}
  footer{border-top:1px solid #e2e2e0;padding:8px 16px;font-size:12px}
  footer a{color:#5f5f5c}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>BBM Tools</b><span id="versie"></span></header>
<main>
  <div class="site" id="site">Bezig…</div>
  <button id="agenda" disabled>→ Agenda<small>Project naar Outlook-afspraak</small></button>
  <button id="kopieer" disabled>2Jours → Kopieer<small>Calculatie naar het klembord</small></button>
  <button id="plak" disabled>Bouw7 ← Plak<small>Regels in deze offerte zetten</small></button>
  <div id="melding"></div>
</main>
<footer><a href="https://bbm.joostmaes.nl/" target="_blank">Uitleg en hulp</a></footer>
<script src="popup.js"></script>
</body>
</html>
